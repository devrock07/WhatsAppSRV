name: Feature request
description: Suggest a focused, safe improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What problem would this solve for a Minecraft/WhatsApp community?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security and privacy impact
      description: Explain any new permissions, commands, stored data, or WhatsApp automation involved.
    validations:
      required: true
